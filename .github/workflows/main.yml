name: main

on:
  push:
  pull_request:

jobs:
  lint:
    name: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (ignore failures)
        run: |
          ruff check . 



  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install req
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests ausführen
        run: pytest -v
